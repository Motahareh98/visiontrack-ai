services:
  mongo:
    image: mongo:7
    ports: ["27019:27017"]
    volumes: ["mongo_data:/data/db"]
  ai:
    build: ./ai-service
    ports: ["8002:8000"]
  server:
    build: ./server
    environment:
      MONGO_URI: mongodb://mongo:27017/visiontrack
      AI_URL: http://ai:8000
      PORT: 5000
    ports: ["5002:5000"]
    depends_on: [mongo, ai]
  client:
    build: ./client
    environment:
      VITE_API_URL: http://localhost:5002
    ports: ["4175:4173"]
    depends_on: [server]
volumes:
  mongo_data:
